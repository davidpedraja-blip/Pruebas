<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de Coger Colores</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #gameContainer {
            position: relative;
            width: 800px;
            height: 600px;
            background: #2d3748;
            border-radius: 20px;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        #gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            pointer-events: none;
        }

        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 40px 60px;
            border-radius: 15px;
            text-align: center;
            color: white;
            display: none;
        }

        #gameOver h2 {
            font-size: 48px;
            margin-bottom: 20px;
            color: #ff6b6b;
        }

        #gameOver p {
            font-size: 24px;
            margin-bottom: 30px;
        }

        #restartBtn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 15px 40px;
            font-size: 20px;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        #restartBtn:hover {
            transform: scale(1.1);
        }

        #instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            text-align: center;
            font-size: 16px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div id="ui">
            <div>Puntos: <span id="score">0</span></div>
            <div>Vidas: <span id="lives">3</span></div>
        </div>
        <div id="gameOver">
            <h2>¡Juego Terminado!</h2>
            <p>Puntuación final: <span id="finalScore">0</span></p>
            <button id="restartBtn">Jugar de Nuevo</button>
        </div>
        <div id="instructions">
            Mueve el mouse para controlar la cesta y coger los colores que caen
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const livesEl = document.getElementById('lives');
        const gameOverEl = document.getElementById('gameOver');
        const finalScoreEl = document.getElementById('finalScore');
        const restartBtn = document.getElementById('restartBtn');

        // Ajustar el canvas al contenedor
        canvas.width = 800;
        canvas.height = 600;

        // Configuración del juego
        let score = 0;
        let lives = 3;
        let gameRunning = true;
        let fallingObjects = [];
        let lastSpawnTime = 0;
        const spawnInterval = 1000; // Spawn cada 1 segundo

        // Colores disponibles
        const colors = ['#ff6b6b', '#4ecdc4', '#ffe66d', '#95e1d3', '#f38181', '#aa96da', '#fcbad3'];

        // Jugador (cesta)
        const player = {
            x: canvas.width / 2,
            y: canvas.height - 60,
            width: 100,
            height: 20,
            color: '#fff'
        };

        // Clase para objetos que caen
        class FallingObject {
            constructor() {
                this.width = 30;
                this.height = 30;
                this.x = Math.random() * (canvas.width - this.width);
                this.y = -this.height;
                this.speed = 2 + Math.random() * 3;
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }

            update() {
                this.y += this.speed;
            }

            draw() {
                // Dibujar círculo con color
                ctx.beginPath();
                ctx.arc(this.x + this.width / 2, this.y + this.height / 2, this.width / 2, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();

                // Agregar brillo
                ctx.beginPath();
                ctx.arc(this.x + this.width / 2 - 5, this.y + this.height / 2 - 5, this.width / 4, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.fill();
            }

            isOffScreen() {
                return this.y > canvas.height;
            }

            collidesWith(player) {
                return this.x < player.x + player.width &&
                       this.x + this.width > player.x &&
                       this.y < player.y + player.height &&
                       this.y + this.height > player.y;
            }
        }

        // Dibujar jugador (cesta)
        function drawPlayer() {
            // Base de la cesta
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.width, player.height);

            // Borde de la cesta
            ctx.strokeStyle = '#ddd';
            ctx.lineWidth = 3;
            ctx.strokeRect(player.x, player.y, player.width, player.height);

            // Líneas de la cesta
            for (let i = 1; i < 5; i++) {
                const x = player.x + (player.width / 5) * i;
                ctx.beginPath();
                ctx.moveTo(x, player.y);
                ctx.lineTo(x, player.y + player.height);
                ctx.stroke();
            }
        }

        // Dibujar fondo con patrón
        function drawBackground() {
            ctx.fillStyle = '#2d3748';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Estrellas de fondo
            ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
            for (let i = 0; i < 50; i++) {
                const x = (i * 97) % canvas.width;
                const y = (i * 131) % canvas.height;
                ctx.fillRect(x, y, 2, 2);
            }
        }

        // Actualizar posición del jugador según el mouse
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            player.x = e.clientX - rect.left - player.width / 2;

            // Mantener al jugador dentro del canvas
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;
        });

        // Spawn de nuevos objetos
        function spawnObject(currentTime) {
            if (currentTime - lastSpawnTime > spawnInterval) {
                fallingObjects.push(new FallingObject());
                lastSpawnTime = currentTime;
            }
        }

        // Actualizar el juego
        function update(currentTime) {
            if (!gameRunning) return;

            // Limpiar canvas
            drawBackground();

            // Spawn de objetos
            spawnObject(currentTime);

            // Actualizar y dibujar objetos
            for (let i = fallingObjects.length - 1; i >= 0; i--) {
                const obj = fallingObjects[i];
                obj.update();
                obj.draw();

                // Verificar colisión con el jugador
                if (obj.collidesWith(player)) {
                    score += 10;
                    scoreEl.textContent = score;
                    fallingObjects.splice(i, 1);
                    continue;
                }

                // Verificar si el objeto salió de la pantalla
                if (obj.isOffScreen()) {
                    lives--;
                    livesEl.textContent = lives;
                    fallingObjects.splice(i, 1);

                    // Verificar game over
                    if (lives <= 0) {
                        gameOver();
                    }
                }
            }

            // Dibujar jugador
            drawPlayer();

            // Continuar el bucle
            requestAnimationFrame(update);
        }

        // Game over
        function gameOver() {
            gameRunning = false;
            finalScoreEl.textContent = score;
            gameOverEl.style.display = 'block';
        }

        // Reiniciar juego
        function restartGame() {
            score = 0;
            lives = 3;
            fallingObjects = [];
            lastSpawnTime = 0;
            gameRunning = true;

            scoreEl.textContent = score;
            livesEl.textContent = lives;
            gameOverEl.style.display = 'none';

            requestAnimationFrame(update);
        }

        restartBtn.addEventListener('click', restartGame);

        // Iniciar el juego
        requestAnimationFrame(update);
    </script>
</body>
</html>
